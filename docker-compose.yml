# Lancement : docker compose up --build
#   API       → http://localhost:7860/docs
#   Frontend  → http://localhost:8501   (Streamlit)
#   Dashboard → http://localhost:8050   (Dash, EDA)
#   MLflow    → http://localhost:5000   (profil optionnel : docker compose --profile mlflow up)

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  environment: &app-env
    PYTHONUNBUFFERED: "1"
    HF_TOKEN: ${HF_TOKEN:-}
  volumes:
    - ./data:/air-quality-app/data
    - ./models:/air-quality-app/models
    - ./logs:/air-quality-app/logs
  networks:
    - air-quality-network
  restart: unless-stopped

services:
  api:
    <<: *app
    container_name: air-quality-api
    ports:
      - "${API_PORT:-7860}:7860"
    environment:
      <<: *app-env
      ENABLE_ETL_SCHEDULER: ${ENABLE_ETL_SCHEDULER:-1}
      MODEL_VERSION: ${MODEL_VERSION:-latest}
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 7860
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    <<: *app
    container_name: air-quality-frontend
    ports:
      - "${UI_PORT:-8501}:8501"
    environment:
      <<: *app-env
      API_URL: http://api:7860
    command: streamlit run frontend/app_ui.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      api:
        condition: service_healthy

  dashboard:
    <<: *app
    container_name: air-quality-dashboard
    ports:
      - "${DASH_PORT:-8050}:8050"
    environment:
      <<: *app-env
      API_URL: http://api:7860
      DASH_HOST: 0.0.0.0
      DASH_PORT: "8050"
    command: python -m dashboard.air_quality
    depends_on:
      api:
        condition: service_healthy

  mlflow:
    <<: *app
    container_name: air-quality-mlflow
    profiles: ["mlflow"]
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/air-quality-app/mlruns
    command: mlflow server --backend-store-uri sqlite:///mlruns/mlflow.db --default-artifact-root /air-quality-app/mlruns/artifacts --host 0.0.0.0 --port 5000

networks:
  air-quality-network:
    driver: bridge
